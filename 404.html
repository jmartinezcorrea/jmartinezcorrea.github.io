<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Julian Martinez-Correa</title>
<meta name="robots" content="noindex">
<!-- Styles are inlined so this page renders correctly no matter what URL
     depth GitHub Pages serves it from. -->
<style>
  :root { --bg:#fdfdfb; --text:#1b1b19; --muted:#56534c; --accent:#8c2332; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 0.75rem;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia,
                 "Times New Roman", serif;
    line-height: 1.6;
    text-align: center;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
  p  { margin: 0; color: var(--muted); max-width: 32rem; }
  a  { color: var(--accent); text-underline-offset: 0.16em; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <h1>Page not found</h1>
  <p>That page does not exist on this site.</p>
  <p><a href="/">Return to the home page</a></p>
</body>
</html>
